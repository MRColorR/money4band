name: Refresh app tables and star chart

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh generated documentation
        run: |
          title='Refresh generated app tables and star chart'
          pending=$(gh pr list --state open --json title --jq 'map(select(.title == "Refresh generated app tables and star chart")) | length')
          if [ "$pending" -gt 0 ]; then
            echo 'A generated documentation update is already open.'
            exit 0
          fi

          uv run --locked python scripts/update_tables.py --refresh
          python scripts/update_star_chart.py
          git add README.md docs/APPS.md docs/catalog-snapshot.json docs/stargazers.json docs/stargazers.svg
          if git diff --cached --quiet; then
            exit 0
          fi

          branch="automation/readme-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh app tables and star chart"
          git push origin "$branch"
          gh pr create --head "$branch" --base "$GITHUB_REF_NAME" --title "$title" \
            --body "Refresh the public catalog snapshots and record the latest aggregate GitHub star count."
