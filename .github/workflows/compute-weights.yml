name: Compute contributor weights

on:
  # Weekly on Sunday at 03:00 UTC - keeps weights.json fresh enough for
  # the half-life algorithm without creating churn on every push.
  schedule:
    - cron: "0 3 * * 0"
  # Manual trigger from the Actions tab for on-demand refreshes.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: compute-weights
  cancel-in-progress: false

jobs:
  compute:
    name: Recompute weights.json
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required so git log --numstat sees every
          # commit, not just the shallow default.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Propose updated contributor weights
        run: |
          pending=$(gh pr list --state open --json headRefName --jq 'map(select(.headRefName | startswith("automation/weights-"))) | length')
          if [ "$pending" -gt 0 ]; then
            echo "A contributor weights update is already open."
            exit 0
          fi

          uv run --locked python scripts/compute_weights.py
          git add config/weights.json
          if git diff --cached --quiet; then
            echo "config/weights.json unchanged - nothing to propose"
            exit 0
          fi

          branch="automation/weights-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(weights): refresh contributor weights"
          git push origin "$branch"
          gh pr create --head "$branch" --base "$GITHUB_REF_NAME" \
            --title "chore(weights): refresh contributor weights" \
            --body "Refresh contributor weights using the current repository history."
          # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
          gh workflow run pr-checks.yml --ref "$branch"
