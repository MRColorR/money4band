name: Build and Release Money4Band

on:
  push:
    tags:
      - "*.*.*"  # Matches tags like 1.0.0, 2.1.1, etc.
  workflow_dispatch:

permissions:
  contents: write      # needed to create GitHub releases
  actions: read        # needed to download artifacts

env:
  # Single source of truth for the PyInstaller invocation. Asset names
  # (Money4Band-<os>-<arch>[.exe]) MUST stay in sync with
  # money4band/updater.py::_get_binary_asset_name or self-update 404s.
  PYINSTALLER_ARGS: >-
    --onefile
    --name Money4Band
    main.py
    --hidden-import colorama
    --hidden-import docker
    --hidden-import httpx
    --hidden-import psutil
    --hidden-import yaml
    --hidden-import secrets
    --hidden-import cryptography
    --hidden-import fastapi
    --hidden-import uvicorn
    --hidden-import money4band
    --hidden-import money4band.apps
    --hidden-import money4band.core
    --hidden-import money4band.docker
    --hidden-import money4band.network
    --hidden-import money4band.system
    --hidden-import money4band.ui
    --hidden-import money4band.api
    --hidden-import money4band.dashboard
    --hidden-import money4band.resources
    -y

jobs:
  # Gate: run tests before building release artifacts
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group dev
      - run: uv run python -m pytest --tb=short -q

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Money4Band-linux-amd64
            docker_platform: ""
          - os: ubuntu-latest
            asset: Money4Band-linux-arm64
            docker_platform: linux/arm64
          - os: ubuntu-latest
            asset: Money4Band-linux-armv7
            docker_platform: linux/arm/v7
          - os: windows-latest
            asset: Money4Band-windows-amd64.exe
            docker_platform: ""
          - os: macos-latest
            asset: Money4Band-macos-arm64
            docker_platform: ""
          - os: macos-15-intel
            asset: Money4Band-macos-amd64
            docker_platform: ""

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        if: matrix.docker_platform == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: matrix.docker_platform == ''
        uses: astral-sh/setup-uv@v5

      # ---- Native builds (runner arch matches target arch) ----
      - name: Install dependencies
        if: matrix.docker_platform == ''
        shell: bash
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Update app tables
        if: matrix.docker_platform == ''
        shell: bash
        run: uv run python scripts/update_tables.py

      # Defence in depth: --add-data bundles config/ wholesale, so any
      # local user state present at build time would ship inside the
      # binary (credentials encrypted with the builder's key - unusable
      # elsewhere and a privacy leak). A CI checkout is clean because
      # these are gitignored; this makes it explicit and guards manual
      # builds run from a working tree.
      - name: Strip user state before bundling
        if: matrix.docker_platform == ''
        shell: bash
        run: rm -f config/user-config.json config/.dashboard.pid config/.dashboard.owner

      # Note: --add-data uses ';' on Windows and ':' on Unix regardless of
      # shell. Bundled config/template are seeded next to the executable on
      # first run by main.py (mutable data cannot live inside the onefile).
      - name: Build with PyInstaller (onefile)
        if: matrix.docker_platform == ''
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; else SEP=":"; fi
          uv run pyinstaller $PYINSTALLER_ARGS \
            --add-data "config${SEP}config" \
            --add-data "money4band${SEP}money4band" \
            --add-data "template${SEP}template"

      # ---- Cross-arch Linux builds via QEMU + Docker ----
      - name: Set up QEMU for cross-compilation
        if: matrix.docker_platform != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        if: matrix.docker_platform != ''
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker for ARM architectures
        if: matrix.docker_platform != ''
        run: |
          docker buildx build \
            --file workflow-linux-arm64.dockerfile \
            --platform ${{ matrix.docker_platform }} \
            --load \
            -t money4band-builder \
            .
          docker create --name m4b-extract money4band-builder
          docker cp m4b-extract:/app/dist ./dist
          docker rm m4b-extract

      # ---- Normalize the artifact name ----
      - name: Rename binary to release asset name (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mv dist/Money4Band "dist/${{ matrix.asset }}"

      - name: Rename binary to release asset name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "dist\Money4Band.exe" "dist\${{ matrix.asset }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.asset }}"
          path: "dist/${{ matrix.asset }}"
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # checksums.sha256 is consumed by the self-updater
      # (money4band/updater.py::_apply_binary_update) for integrity checks.
      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum Money4Band-* > checksums.sha256
          cat checksums.sha256

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Money4Band ${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true  # GitHub-native changelog from PR titles
          files: "./artifacts/*"
          # Releases start as prerelease BY DESIGN: the maintainer validates
          # the build, then manually promotes it to "latest" on GitHub -
          # only then does the in-app updater start offering it to users.
          prerelease: true
