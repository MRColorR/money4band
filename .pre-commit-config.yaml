# Pre-commit hooks for Money4Band
# Install: uv tool install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Built-in credential detection (lightweight, no external deps)
  - repo: local
    hooks:
      - id: check-secrets
        name: Check for hardcoded credentials
        entry: python scripts/check-secrets.py
        language: python
        pass_filenames: false
        stages: [pre-commit]

  # Gitleaks — comprehensive secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # App tables — regenerate from app-config.json
  - repo: local
    hooks:
      - id: update-tables
        name: App tables up-to-date
        entry: uv run python scripts/update_tables.py --check
        language: system
        pass_filenames: false
        files: (config/app-config\.json|README\.md|docs/APPS\.md|money4band/readme_generator\.py)
        stages: [pre-commit]

  # Requirements — keep in sync with uv.lock
  - repo: local
    hooks:
      - id: sync-requirements
        name: Requirements files up-to-date
        entry: uv run python scripts/sync_requirements.py --check
        language: system
        pass_filenames: false
        files: (pyproject\.toml|uv\.lock)
        stages: [pre-commit]

  # Ruff — linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
